name: Release

# Builds, signs, notarizes and publishes the WiFi Lens OSS DMG. Release
# credentials are shared at the ShiinaLabs organization level, while the
# Sparkle appcast key remains specific to this repository.
#
# Required organization secrets / variables:
#   APPLE_DEVELOPER_ID_CERTIFICATE_BASE64     base64 of the Developer ID Application .p12
#   APPLE_DEVELOPER_ID_CERTIFICATE_PASSWORD   password for that .p12
#   APPLE_TEAM_ID                             Developer Team ID (organization variable)
#   APPLE_ID                                  Apple ID used for notarization
#   APPLE_APP_SPECIFIC_PASSWORD               app-specific password for that Apple ID
#
# Required repository secret:
#   SPARKLE_ED25519_PRIVATE_KEY               Sparkle appcast signing key

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build (for example v1.4.2 or 1.4.2)"
        required: true
        type: string

permissions:
  contents: write

env:
  RELEASE_CONFIG: Release

jobs:
  release:
    runs-on: macos-26
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
      SPARKLE_VERSION: "2.9.5"
      ARCHIVE_PATH: ${{ github.workspace }}/build/WiFiLens.xcarchive
      EXPORT_PATH: ${{ github.workspace }}/build/export
      DMG_BASENAME: WiFiLens
      APP_BUNDLE_NAME: "WiFi Lens"
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Resolve Release Ref
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            RAW_TAG="${{ github.event.inputs.tag }}"
            case "$RAW_TAG" in
              v*) RELEASE_TAG="$RAW_TAG" ;;
              *) RELEASE_TAG="v$RAW_TAG" ;;
            esac
            git checkout "refs/tags/$RELEASE_TAG"
          else
            RELEASE_TAG="${GITHUB_REF#refs/tags/}"
          fi

          echo "RELEASE_TAG=$RELEASE_TAG" >> "$GITHUB_ENV"

      - name: Verify Release Version
        run: |
          VERSION="${RELEASE_TAG#v}"
          CONFIG_FILE="WiFiLens/Configs/Base.xcconfig"

          MARKETING_VERSION="$(grep -E '^MARKETING_VERSION[[:space:]]*=' "$CONFIG_FILE" | head -1 | sed 's/^[^=]*=[[:space:]]*//' | tr -d '[:space:]')"
          CURRENT_PROJECT_VERSION="$(grep -E '^CURRENT_PROJECT_VERSION[[:space:]]*=' "$CONFIG_FILE" | head -1 | sed 's/^[^=]*=[[:space:]]*//' | tr -d '[:space:]')"

          if [ -z "$MARKETING_VERSION" ]; then
            echo "error: MARKETING_VERSION not found in $CONFIG_FILE" >&2
            exit 1
          fi

          echo "App version in $CONFIG_FILE: MARKETING_VERSION=$MARKETING_VERSION (CURRENT_PROJECT_VERSION=$CURRENT_PROJECT_VERSION)"

          if [ "$VERSION" != "$MARKETING_VERSION" ]; then
            echo "error: release tag '$RELEASE_TAG' resolves to VERSION='$VERSION' but app MARKETING_VERSION is '$MARKETING_VERSION'; aborting to avoid a Sparkle update that would be skipped" >&2
            exit 1
          fi

          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Import Developer ID Certificate
        env:
          CERTIFICATE_P12: ${{ secrets.APPLE_DEVELOPER_ID_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN_PASSWORD="$(uuidgen)"
          KEYCHAIN="$RUNNER_TEMP/wifi-lens.keychain-db"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          echo "$CERTIFICATE_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" \
            -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security \
            -T /usr/bin/productbuild -T /usr/bin/xcodebuild
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security default-keychain -s "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db
          rm -f "$RUNNER_TEMP/cert.p12"

          IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN" | grep "Developer ID Application" | head -1 | sed 's/.*"\(.*\)"/\1/')
          if [ -z "$IDENTITY" ]; then
            echo "Developer ID Application signing identity not found" >&2
            exit 1
          fi
          echo "SIGNING_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"

      - name: Create Export Options
        run: |
          EXPORT_OPTIONS_PLIST="$RUNNER_TEMP/ExportOptions.plist"
          cat > "$EXPORT_OPTIONS_PLIST" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "https://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>destination</key>
            <string>export</string>
            <key>method</key>
            <string>developer-id</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>signingCertificate</key>
            <string>Developer ID Application</string>
            <key>teamID</key>
            <string>$TEAM_ID</string>
          </dict>
          </plist>
          EOF
          echo "EXPORT_OPTIONS_PLIST=$EXPORT_OPTIONS_PLIST" >> "$GITHUB_ENV"

      - name: Archive Release
        run: |
          rm -rf "$ARCHIVE_PATH" "$EXPORT_PATH"

          xcodebuild archive \
            -project WiFiLens.xcodeproj \
            -scheme "WiFi Lens" \
            -configuration "$RELEASE_CONFIG" \
            -archivePath "$ARCHIVE_PATH" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="$SIGNING_IDENTITY" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CODE_SIGN_INJECT_BASE_ENTITLEMENTS=NO \
            ENABLE_HARDENED_RUNTIME=YES \
            OTHER_CODE_SIGN_FLAGS="--timestamp"

      - name: Export Archived App
        run: |
          xcodebuild -exportArchive \
            -archivePath "$ARCHIVE_PATH" \
            -exportPath "$EXPORT_PATH" \
            -exportOptionsPlist "$EXPORT_OPTIONS_PLIST"

      - name: Discover Exported App
        run: |
          APP_PATH=$(find "$EXPORT_PATH" -maxdepth 1 -name "*.app" | head -1)
          if [ -z "$APP_PATH" ]; then
            echo "Exported app not found in $EXPORT_PATH" >&2
            exit 1
          fi

          echo "APP_PATH=$APP_PATH" >> "$GITHUB_ENV"

      - name: Verify Exported App Signatures
        run: |
          codesign --verify --deep --strict --verbose=4 "$APP_PATH"

      - name: Verify Sparkle Entitlements Isolation
        run: |
          MAIN_ENTITLEMENTS_PATH="$RUNNER_TEMP/main-app.entitlements.plist"
          SPARKLE_XPC_DIR="$APP_PATH/Contents/Frameworks/Sparkle.framework/Versions/Current/XPCServices"

          if [ ! -d "$SPARKLE_XPC_DIR" ]; then
            echo "Expected Sparkle XPC directory missing: $SPARKLE_XPC_DIR" >&2
            exit 1
          fi

          codesign -d --entitlements :- "$APP_PATH" > "$MAIN_ENTITLEMENTS_PATH"
          cat "$MAIN_ENTITLEMENTS_PATH"

          export MAIN_ENTITLEMENTS_PATH
          export SPARKLE_XPC_DIR
          python3 <<'PY'
          import glob
          import os
          import plistlib
          import subprocess
          import sys

          main_path = os.environ["MAIN_ENTITLEMENTS_PATH"]
          xpc_dir = os.environ["SPARKLE_XPC_DIR"]

          explicit_forbidden = {
              "com.apple.security.app-sandbox",
              "com.apple.security.device.bluetooth",
              "com.apple.security.files.user-selected.read-write",
              "com.apple.security.inherit",
              "com.apple.security.network.client",
              "com.apple.security.network.server",
              "com.apple.security.personal-information.location",
          }
          forbidden_prefixes = (
              "com.apple.security.device.",
              "com.apple.security.files.",
              "com.apple.security.personal-information.",
          )

          def load_entitlements(path: str) -> dict:
              with open(path, "rb") as fh:
                  data = fh.read().strip()
              return plistlib.loads(data) if data else {}

          def is_enabled(value) -> bool:
              if isinstance(value, bool):
                  return value
              return value is not None

          main_entitlements = load_entitlements(main_path)
          forbidden_keys = set(explicit_forbidden)
          for key, value in main_entitlements.items():
              if not key.startswith("com.apple.security."):
                  continue
              if key == "com.apple.security.temporary-exception.mach-lookup.global-name":
                  continue
              if is_enabled(value):
                  forbidden_keys.add(key)

          xpc_paths = sorted(glob.glob(os.path.join(xpc_dir, "*.xpc")))
          if not xpc_paths:
              print(f"No Sparkle XPC services found in {xpc_dir}", file=sys.stderr)
              sys.exit(1)

          violations = []
          for xpc_path in xpc_paths:
              entitlements_path = os.path.join(
                  os.environ["RUNNER_TEMP"],
                  f"{os.path.basename(xpc_path)}.entitlements.plist",
              )
              with open(entitlements_path, "wb") as fh:
                  subprocess.run(
                      ["codesign", "-d", "--entitlements", ":-", xpc_path],
                      check=True,
                      stdout=fh,
                  )
              entitlements = load_entitlements(entitlements_path)
              print(f"--- {xpc_path} ---")
              with open(entitlements_path, "r", encoding="utf-8", errors="ignore") as fh:
                  sys.stdout.write(fh.read())

              for key, value in entitlements.items():
                  if not is_enabled(value):
                      continue
                  if key in forbidden_keys or key.startswith(forbidden_prefixes):
                      violations.append((xpc_path, key))

          if violations:
              for xpc_path, key in violations:
                  print(f"Forbidden entitlement {key} found in {xpc_path}", file=sys.stderr)
              sys.exit(1)
          PY

      - name: Prepare App Bundle
        run: |
          ditto "$APP_PATH" "$APP_BUNDLE_NAME.app"

      - name: Create DMG
        run: |
          bash scripts/create-dmg.sh "$APP_BUNDLE_NAME.app" "$DMG_BASENAME.dmg" "$DMG_BASENAME"

      - name: Sign DMG
        run: |
          codesign --sign "$SIGNING_IDENTITY" --timestamp --options=runtime "$DMG_BASENAME.dmg"

      - name: Notarize DMG
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: |
          NOTARY_EXIT=0
          xcrun notarytool submit "$DMG_BASENAME.dmg" \
            --apple-id "$APPLE_ID" \
            --team-id "$TEAM_ID" \
            --password "$APPLE_APP_PASSWORD" \
            --wait | tee "$RUNNER_TEMP/notary-output.txt" || NOTARY_EXIT=$?

          SUBMISSION_ID=$(grep -o 'id: [a-f0-9-]*' "$RUNNER_TEMP/notary-output.txt" | head -1 | cut -d' ' -f2)
          if [ -n "$SUBMISSION_ID" ]; then
            echo "--- Notarization Log ---"
            xcrun notarytool log "$SUBMISSION_ID" \
              --apple-id "$APPLE_ID" \
              --team-id "$TEAM_ID" \
              --password "$APPLE_APP_PASSWORD"
          fi
          exit $NOTARY_EXIT

      - name: Staple Notarization Ticket
        run: |
          xcrun stapler staple "$DMG_BASENAME.dmg"
          xcrun stapler validate "$DMG_BASENAME.dmg"

      - name: Verify Notarized DMG
        run: |
          spctl -a -vvv -t install "$DMG_BASENAME.dmg"

      - name: Download Sparkle Tools
        run: |
          curl -sSL "https://github.com/sparkle-project/Sparkle/releases/download/${SPARKLE_VERSION}/Sparkle-${SPARKLE_VERSION}.tar.xz" \
            -o "$RUNNER_TEMP/sparkle.tar.xz"
          tar xf "$RUNNER_TEMP/sparkle.tar.xz" -C "$RUNNER_TEMP"
          SPARKLE_BIN_DIR=$(dirname "$(find "$RUNNER_TEMP" -name generate_appcast -type f | head -1)")
          echo "$SPARKLE_BIN_DIR" >> "$GITHUB_PATH"

      - name: Generate Signed Appcast
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_ED25519_PRIVATE_KEY }}
        run: |
          echo "$SPARKLE_PRIVATE_KEY" > "$RUNNER_TEMP/sparkle-ed-key"

          mkdir -p "$RUNNER_TEMP/appcast-dir"
          cp "$DMG_BASENAME.dmg" "$RUNNER_TEMP/appcast-dir/"

          generate_appcast \
            --ed-key-file "$RUNNER_TEMP/sparkle-ed-key" \
            --download-url-prefix "https://github.com/${{ github.repository }}/releases/download/v${{ env.VERSION }}/" \
            -o appcast.xml \
            "$RUNNER_TEMP/appcast-dir"

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ env.VERSION }}
          files: |
            ${{ env.DMG_BASENAME }}.dmg
            appcast.xml
          draft: true
          generate_release_notes: true
