name: Swift CI

on:
  push:
    branches:
      - master
    paths:
      - ".github/workflows/swift-ci.yml"
      - ".github/workflows/release.yml"
      - "ci_scripts/**"
      - "rust-core/**"
      - "WiFiLens/**"
      - "WiFiLensCore/**"
      - "WiFiLens.xcodeproj/**"
      - "AGENTS.md"
      - ".agents/**"
      - "docs/architecture/**"
      - "scripts/check-public-project-boundary.py"
      - ".swift-format"
      - "scripts/format_xcstrings.py"
      - "scripts/xcstrings_key_order.swift"
      - "scripts/install-rust-toolchain.sh"
      - "scripts/tests/**"
      - "scripts/create-dmg.sh"
      - "assets/**"
  pull_request:
    paths:
      - ".github/workflows/swift-ci.yml"
      - ".github/workflows/release.yml"
      - "ci_scripts/**"
      - "rust-core/**"
      - "WiFiLens/**"
      - "WiFiLensCore/**"
      - "WiFiLens.xcodeproj/**"
      - "AGENTS.md"
      - ".agents/**"
      - "docs/architecture/**"
      - "scripts/check-public-project-boundary.py"
      - ".swift-format"
      - "scripts/format_xcstrings.py"
      - "scripts/xcstrings_key_order.swift"
      - "scripts/install-rust-toolchain.sh"
      - "scripts/tests/**"
      - "scripts/create-dmg.sh"
      - "assets/**"
  workflow_dispatch:

permissions:
  contents: read

env:
  DEBUG_CONFIG: Debug

jobs:
  rust-portable:
    name: Rust core (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Install pinned Rust toolchain
        shell: bash
        run: scripts/install-rust-toolchain.sh rust-core

      - name: Test portable Rust core
        working-directory: rust-core
        run: cargo test --locked

  build-and-test:
    runs-on: macos-26
    timeout-minutes: 20
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v7

      - name: Install pinned Rust toolchain
        run: scripts/install-rust-toolchain.sh rust-core

      - name: Test Rust core on runner architecture
        shell: bash
        run: |
          case "$(uname -m)" in
            arm64) target=aarch64-apple-darwin ;;
            x86_64) target=x86_64-apple-darwin ;;
            *) echo "Unsupported macOS runner architecture: $(uname -m)" >&2; exit 1 ;;
          esac
          cd rust-core
          cargo fmt --check
          cargo test --locked --target "$target"

      - name: Check public project ownership
        run: python3 scripts/check-public-project-boundary.py

      - name: Check string catalog formatting
        run: python3 scripts/format_xcstrings.py --check

      - name: Test formatter and staged-file safety
        run: python3 -m unittest discover -s scripts/tests -p 'test_format_xcstrings.py'

      - name: Build
        run: |
          xcodebuild -project WiFiLens.xcodeproj \
            -scheme "WiFi Lens" \
            -configuration "$DEBUG_CONFIG" \
            -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            build

      - name: Test
        run: |
          xcodebuild -project WiFiLens.xcodeproj \
            -scheme "WiFi Lens" \
            -configuration "$DEBUG_CONFIG" \
            -destination 'platform=macOS' \
            -skipPackageUpdates \
            -only-testing:WiFiLensTests \
            -only-testing:WiFiLensCoreTests \
            CODE_SIGNING_ALLOWED=NO \
            test
