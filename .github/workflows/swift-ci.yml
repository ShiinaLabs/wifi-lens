name: Swift CI

on:
  push:
    branches:
      - master
    paths:
      - ".github/workflows/swift-ci.yml"
      - ".github/workflows/release.yml"
      - "WiFiLens/**"
      - "WiFiLensCore/**"
      - "WiFiLens.xcodeproj/**"
      - "AGENTS.md"
      - ".agents/**"
      - "docs/architecture/**"
      - "scripts/check-public-project-boundary.py"
      - "scripts/tests/**"
      - "scripts/create-dmg.sh"
      - "assets/**"
  pull_request:
    paths:
      - ".github/workflows/swift-ci.yml"
      - ".github/workflows/release.yml"
      - "WiFiLens/**"
      - "WiFiLensCore/**"
      - "WiFiLens.xcodeproj/**"
      - "AGENTS.md"
      - ".agents/**"
      - "docs/architecture/**"
      - "scripts/check-public-project-boundary.py"
      - "scripts/tests/**"
      - "scripts/create-dmg.sh"
      - "assets/**"
  workflow_dispatch:

permissions:
  contents: read

env:
  DEBUG_CONFIG: Debug

jobs:
  build-and-test:
    runs-on: macos-26
    timeout-minutes: 20
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v7

      - name: Check public project ownership
        run: python3 scripts/check-public-project-boundary.py

      - name: Build
        run: |
          xcodebuild -project WiFiLens.xcodeproj \
            -scheme "WiFi Lens" \
            -configuration "$DEBUG_CONFIG" \
            -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            build

      - name: Test
        run: |
          xcodebuild -project WiFiLens.xcodeproj \
            -scheme "WiFi Lens" \
            -configuration "$DEBUG_CONFIG" \
            -destination 'platform=macOS' \
            -skipPackageUpdates \
            -only-testing:WiFiLensTests \
            -only-testing:WiFiLensCoreTests \
            CODE_SIGNING_ALLOWED=NO \
            test
